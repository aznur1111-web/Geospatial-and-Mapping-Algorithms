{id:"latlon-haversine",title:"Latitude, longitude and the Haversine formula",level:2,kind:"Coordinates",status:"Runnable teaching lab",

 mentalText:"Start with an approximate distance and azimuth. Iterate until the computed latitudes match the observed ones. Converges in a few iterations except for nearly antipodal points.",
 steps:["Initialise the auxiliary sphere.","Iterate the Vincenty formulas until convergence.","Compute the final distance and azimuths.","Handle special cases (antipodal, equatorial)."],
 pseudo:"Inverse Vincenty (distance and azimuths):\n  U1 = atan((1 - f) tan(phi1))\n  U2 = atan((1 - f) tan(phi2))\n  L = dlambda\n  lambda = L\n\n  iterate until |dlambda - lambda| < tol:\n    sin_sigma = sqrt((cos U2 sin lambda)^2 + (cos U1 sin U2 - sin U1 cos U2 cos lambda)^2)\n    cos_sigma = sin U1 sin U2 + cos U1 cos U2 cos lambda\n    sigma = atan2(sin_sigma, cos_sigma)\n    sin_alpha = cos U1 cos U2 sin lambda / sin_sigma\n    cos2_alpha = 1 - sin_alpha^2\n    cos_2sigma_m = cos_sigma - 2 sin U1 sin U2 / cos2_alpha\n    C = f/16 cos2_alpha (4 + f (4 - 3 cos2_alpha))\n    lambda = L + (1 - C) f sin_alpha (sigma + C sin_sigma (cos_2sigma_m + C cos_sigma (-1 + 2 cos_2sigma_m^2)))\n\n  u2 = cos2_alpha (a^2 - b^2) / b^2\n  A = 1 + u2/16384 (4096 + u2 (-768 + u2 (320 - 175 u2)))\n  B = u2/1024 (256 + u2 (-128 + u2 (74 - 47 u2)))\n  dsigma = B sin_sigma (cos_2sigma_m + B/4 (cos_sigma (-1 + 2 cos_2sigma_m^2) - B/6 cos_2sigma_m (-3 + 4 sin_sigma^2)(-3 + 4 cos_2sigma_m^2)))\n  s = b A (sigma - dsigma)\n\nConstants (WGS-84):\n  a = 6378137 m\n  f = 1 / 298.257223563\n  b = a (1 - f) = 6356752.314245 m\n\nAccuracy: 0.5 mm on WGS-84 (iterative)\n\nFailure case: nearly antipodal points fail to converge\n  use Karney's algorithm or fall back to a great-circle distance",
 uses:"GPS accuracy, geodesy, surveying, route planning.",
 strength:"Millimetre accuracy on the ellipsoid.",
 limits:"Iterative and can fail for nearly antipodal points.",
 pitfall:"Assuming Vincenty always converges. Use Karney's algorithm for robust handling of antipodal points.",
 question:"Why is Vincenty more accurate than Haversine?",
 answer:"Vincenty uses the WGS-84 ellipsoid, not a sphere. The Earth's flattening is about 1/298, which Haversine ignores.",
 demo:"vincenty",sample:"52.5200 13.4050\n48.8566 2.3522",refs:[
  ["Vincenty, Direct and inverse solutions of geodesics on the ellipsoid with application of nested equations, Survey Review 1975","https://doi.org/10.1179/sre.1975.23.176.88"],
  ["Karney, Algorithms for geodesics, J. Geodesy 2013","https://doi.org/10.1007/s00190-012-0578-z"],
  ["GeographicLib","https://geographiclib.sourceforge.io/"]]},
{id:"map-units",title:"Map units and degree-to-metre conversion",level:2,kind:"Coordinates",status:"Runnable teaching lab",
 summary:"Degrees of latitude are nearly constant in length; degrees of longitude shorten as latitude increases. Converting a degree difference to metres needs the latitude.",
 mental:"Longitude lines converge at the poles",
 mentalText:"At the equator 1° of longitude ≈ 111.32 km. At 60° latitude it is about half that. Latitude lines are always about 111.32 km per degree.",
 steps:["Measure the degree difference.","Multiply latitude degrees by ~111.32 km.","Multiply longitude degrees by ~111.32 km * cos(latitude).","Use an ellipsoidal formula for precision."],
 pseudo:"WGS-84 approximate metres per degree at latitude phi:\n  lat: 111132.92 - 559.82 cos(2 phi) + 1.175 cos(4 phi) - 0.0023 cos(6 phi)\n  lon: 111412.84 cos(phi) - 93.5 cos(3 phi) + 0.118 cos(5 phi)\n\nSimpler spherical approximation (R = 6371008.8 m):\n  lat: pi R / 180           ~ 111194.9 m\n  lon: pi R / 180 * cos(phi)\n\nNautical mile:\n  1 nm = 1852 m exactly\n  = 1 minute of arc of latitude\n\nDegree grid sizes:\n  decimal degree  (dd.ddddd)  ~ 1.1 m\n  DMS             (ddd mm ss) ~ 30 m\n  1 minute of lat ~ 1852 m\n  1 second of lat ~ 30.87 m\n\nPrecision rules of thumb:\n  5 decimal places ~ 1.1 m\n  6 decimal places ~ 0.11 m\n  7 decimal places ~ 0.011 m\n\nUTM:\n  zones are 6 degrees of longitude wide\n  unit is metre in a local transverse Mercator",
 uses:"Converting between map units, GPS precision, tile grids.",
 strength:"Simple conversion that works to a fraction of a percent.",
 limits:"Approximate at extreme latitudes. Ellipsoidal formula needed for geodesy.",
 pitfall:"Assuming degrees are square. One degree of longitude is much shorter than one degree of latitude at high latitudes.",
 question:"How many metres is one degree of longitude at 60°N?",
 answer:"About 111.32 km * cos(60°) = 55.66 km. Half the equatorial value.",
 demo:"map-units",sample:"52.52\n13.40\n1.0 1.0",refs:[
  ["Wikipedia, Geographic coordinate system","https://en.wikipedia.org/wiki/Geographic_coordinate_system"],
  ["NIMA, WGS-84 technical report","https://earth-info.nga.mil/GandG/publications/tr8350.2/tr8350_2.html"],
  ["Snyder, Map Projections: A Working Manual, USGS 1987","https://pubs.usgs.gov/pp/1395/report.pdf"]]},

{id:"mercator",title:"Mercator and Web Mercator projection",level:3,kind:"Projection",status:"Runnable teaching lab",
 summary:"Mercator is a conformal cylindrical projection that preserves angles. It distorts area hugely at high latitudes. Web Mercator (EPSG:3857) is the de facto standard for tiled web maps.",
 mental:"Wrap the globe around a cylinder tangent at the equator",
 mentalText:"Longitude maps linearly to x. Latitude maps to y via a logarithmic formula so that angles are preserved.",
 steps:["Convert lat/lon to radians.","Apply the Mercator formula.","Scale by the tile radius.","Convert to pixels for tiles."],
 pseudo:"Forward Mercator (ellipsoidal):\n  x = R * lambda\n  y = R * ln(tan(pi/4 + phi/2) * ((1 - e sin phi)/(1 + e sin phi))^(e/2))\n\nSpherical Mercator (Web Mercator):\n  x = R * lambda\n  y = R * ln(tan(pi/4 + phi/2))\n\nInverse:\n  lambda = x / R\n  phi = 2 atan(exp(y / R)) - pi/2\n\nWeb Mercator (EPSG:3857):\n  R = 6378137 m\n  x in [-pi R, pi R]\n  y in [-pi R, pi R]\n  max latitude ~ 85.0511° (where y = pi R)\n\nTile scheme (XYZ):\n  zoom z in [0, 22]\n  n = 2^z tiles along each side\n  tile x = floor((lon + 180) / 360 * n)\n  tile y = floor((1 - ln(tan(lat) + sec(lat)) / pi) / 2 * n)\n\nProperties:\n  conformal: preserves angles\n  great circles do not map to straight lines (except meridians)\n  rhumb lines are straight (constant bearing)\n  area distortion: infinite at the poles\n\nUsed by:\n  Google Maps, OpenStreetMap, Mapbox (Web Mercator)\n  nautical charts (ellipsoidal Mercator)",
 uses:"Web tiles, nautical charts, any map that needs to preserve local shape.",
 strength:"Conformal. Fast. Standard for web mapping.",
 limits:"Area distortion near the poles. Not for global thematic maps.",
 pitfall:"Using Mercator for a world area map. Greenland looks like Africa but is 14x smaller.",
 question:"Why is Web Mercator limited to about 85° latitude?",
 answer:"At 85.0511° the y coordinate reaches pi R. Beyond that, y goes to infinity as latitude approaches 90°.",
 demo:"mercator",sample:"52.5200 13.4050\n48.8566 2.3522\n40.7128 -74.0060",refs:[
  ["Snyder, Map Projections: A Working Manual, USGS 1987","https://pubs.usgs.gov/pp/1395/report.pdf"],
  ["EPSG, Web Mercator (EPSG:3857)","https://epsg.io/3857"],
  ["Battersby et al., Implications of Web Mercator and its use in online mapping, Cartographica 2014","https://doi.org/10.3138/carto.49.2.2313"]]},
{id:"transverse-utm",title:"Transverse Mercator and UTM",level:4,kind:"Projection",status:"Runnable teaching lab",
 summary:"Transverse Mercator rotates the Mercator cylinder 90° so it is tangent along a meridian. UTM divides the world into 60 zones of 6° longitude, each with its own transverse Mercator projection. Scale error is small within a zone.",
 mental:"Rotate the cylinder to touch a chosen meridian",
 mentalText:"Each UTM zone has a central meridian with scale 0.9996, so distortion is small across the zone.",
 steps:["Determine the UTM zone from longitude.","Compute the transverse Mercator coordinates.","Apply the 0.9996 scale factor.","Add the zone-specific false easting and northing."],
 pseudo:"UTM zones:\n  zone = floor((lon + 180) / 6) + 1\n  central meridian = -180 + (zone - 0.5) * 6\n\nTransverse Mercator (spherical):\n  B = cos(phi) sin(lambda - lambda0)\n  x = 0.5 R k0 ln((1 + B)/(1 - B))\n  y = R k0 (atan(tan(phi)/cos(lambda - lambda0)) - phi0)\n\nEllipsoidal (Krüger series, standard):\n  N = a / sqrt(1 - e^2 sin^2 phi)\n  T = tan^2 phi\n  C = e'^2 cos^2 phi\n  A = (lambda - lambda0) cos phi\n\n  x = k0 N (A + (1 - T + C) A^3 / 6 + (5 - 18 T + T^2 + 72 C - 58 e'^2) A^5 / 120)\n  y = k0 (M + N tan phi (A^2 / 2 + (5 - T + 9 C + 4 C^2) A^4 / 24 + (61 - 58 T + T^2 + 600 C - 330 e'^2) A^6 / 720))\n\nUTM conventions:\n  scale factor k0 = 0.9996\n  false easting = 500 000 m\n  false northing = 0 (north), 10 000 000 m (south)\n  unit: metre\n\nScale error:\n  0.9996 at the central meridian\n  1.0000 at ~180 km from the central meridian\n  1.00097 at the zone edge (3°)\n\nSpecial zones:\n  zone 32V extended for Norway\n  zones 31X, 33X, 35X, 37X for Svalbard\n\nAccuracy:\n  Krüger series good to mm within 3° of central meridian\n  Extended series (Karney-Krüger) for wider zones",
 uses:"Military mapping, national grids, cadastral surveys.",
 strength:"Small scale error within a zone. Standard worldwide grid.",
 limits:"Zone discontinuities. Not for polar regions.",
 pitfall:"Treating UTM as a global coordinate system. Always include the zone number.",
 question:"What is the scale error at the edge of a UTM zone?",
 answer:"About 1.00097, i.e. 0.1% error. Small enough for most engineering work.",
 demo:"utm",sample:"52.5200 13.4050\n33\n0.9996",refs:[
  ["Snyder, Map Projections: A Working Manual, USGS 1987","https://pubs.usgs.gov/pp/1395/report.pdf"],
  ["Karney, Transverse Mercator with an accuracy of a few nanometers, J. Geodesy 2011","https://doi.org/10.1007/s00190-011-0445-3"],
  ["NGA, UTM grid zones","https://earth-info.nga.mil/GandG/coordsys/grids/utm.html"]]},
{id:"equal-area",title:"Equal-area and other projections",level:4,kind:"Projection",status:"Runnable teaching lab",
 summary:"Equal-area projections preserve area, at the cost of shape. Lambert azimuthal equal-area, Albers, and Mollweide are common. Conformal projections preserve shape but not area. No projection preserves both.",
 mental:"You can preserve area or shape, not both",
 mentalText:"A conformal projection preserves angles locally. An equal-area projection preserves area everywhere. The choice depends on what the map is for.",
 steps:["Choose the property to preserve.","Select the projection class.","Apply the forward formula.","Check the distortion at the region of interest."],
 pseudo:"Lambert azimuthal equal-area (spherical):\n  k = sqrt(2 / (1 + sin phi0 sin phi + cos phi0 cos phi cos(lambda - lambda0)))\n  x = R k cos phi sin(lambda - lambda0)\n  y = R k (cos phi0 sin phi - sin phi0 cos phi cos(lambda - lambda0))\n\nAlbers conic equal-area (spherical):\n  n = (sin phi1 + sin phi2) / 2\n  C = cos^2 phi1 + 2 n sin phi1\n  rho = R sqrt(C - 2 n sin phi) / n\n  theta = n (lambda - lambda0)\n  x = rho sin theta\n  y = rho0 - rho cos theta\n\nMollweide (pseudocylindrical equal-area):\n  2 theta + sin 2 theta = pi sin phi\n  x = 2 sqrt(2) R / pi * (lambda - lambda0) cos theta\n  y = sqrt(2) R sin theta\n\nProperties:\n  equal-area: preserves area everywhere\n  conformal: preserves angles locally\n  equidistant: preserves distance along some lines\n  compromise: balances distortions (Robinson, Winkel Tripel)\n\nProjection trade-offs:\n  Mercator:          conformal, area distorted\n  Lambert Azimuthal: equal-area, shape distorted at edges\n  Albers:            equal-area conic, good for mid-latitudes\n  Mollweide:         equal-area, elliptical, whole world\n  Robinson:          compromise, looks nice\n  Winkel Tripel:     compromise, used by National Geographic\n\nTissot's indicatrix:\n  a small circle on the sphere becomes an ellipse on the map\n  equal-area: ellipse has the same area everywhere\n  conformal: ellipse is a circle\n  the semi-axes a and b measure local distortion",
 uses:"World thematic maps, atlases, GIS visualization.",
 strength:"Preserves the chosen property.",
 limits:"No projection preserves both area and shape.",
 pitfall:"Using Mercator for a choropleth world map. Areas look wrong and mislead the reader.",
 question:"What is the Tissot indicatrix?",
 answer:"A small circle on the sphere, projected to an ellipse. The shape and size of the ellipse indicate the local distortion of the projection.",
 demo:"equal-area",sample:"52.5200 13.4050\n52.0 10.0",refs:[
  ["Snyder, Map Projections: A Working Manual, USGS 1987","https://pubs.usgs.gov/pp/1395/report.pdf"],
  ["Snyder and Voxland, An Album of Map Projections, USGS 1989","https://pubs.usgs.gov/pp/1453/report.pdf"],
  ["PROJ, coordinate transformation library","https://proj.org/"]]},

{id:"quadtree-grid",title:"Uniform grids and quadtrees",level:3,kind:"Indexing",status:"Runnable teaching lab",
 summary:"A uniform grid partitions space into equal cells. A quadtree recursively splits a cell into four when it holds too many items. Both give fast spatial queries and simple implementation.",
 mental:"Divide space, then subdivide where it is dense",
 mentalText:"The grid works well when points are spread evenly. The quadtree adapts to density by subdividing.",
 steps:["Choose a cell size (grid) or capacity (quadtree).","Insert points.","For a query, visit only relevant cells.","For a quadtree, descend into overlapping quadrants."],
 pseudo:"Uniform grid:\n  cell_size s\n  for each point p:\n    (i, j) = (floor(p.x / s), floor(p.y / s))\n    grid[(i, j)].append(p)\n\nRange query (bounding box B):\n  for i in [floor(B.xmin / s)..floor(B.xmax / s)]:\n    for j in [floor(B.ymin / s)..floor(B.ymax / s)]:\n      check each point in grid[(i, j)]\n\nQuadtree:\n  node has a bounding box and up to C points\n  if insert exceeds C: split into four quadrants\n\n  insert(p):\n    if node is leaf and has capacity:\n      add p\n    elif leaf and full:\n      split into four children\n      reinsert points\n    else:\n      descend into the child containing p\n\n  query(B):\n    if node.bbox does not intersect B: return\n    if leaf: return points in B\n    recurse on each child\n\nComplexity:\n  grid:  O(1) insert, O(k + r) range query (r = cells visited)\n  quadtree: O(log n) insert and query on average\n\nVariants:\n  octree (3D)\n  k-d tree (binary split by dimension)\n  R-tree (bounding boxes)\n  ball tree (metric space)",
 uses:"Game engines, GIS, collision detection, image compression.",
 strength:"Simple, fast for evenly distributed data.",
 limits:"Grid has a fixed cell size. Quadtrees degrade for pathological inputs.",
 pitfall:"Choosing a cell size that is too small or too large. Both hurt performance.",
 question:"When does a quadtree outperform a uniform grid?",
 answer:"When the point density is highly non-uniform. The quadtree subdivides only where needed.",
 demo:"quadtree",sample:"100\n10\n20\n5",refs:[
  ["Finkel and Bentley, Quad trees: a data structure for retrieval on composite keys, Acta Informatica 1974","https://doi.org/10.1007/BF00288933"],
  ["Samet, Foundations of Multidimensional and Metric Data Structures, Morgan Kaufmann 2006","https://www.elsevier.com/books/foundations-of-multidimensional-and-metric-data-structures/samet/978-0-12-369446-1"],
  ["Samet, The Design and Analysis of Spatial Data Structures, Addison-Wesley 1990","https://www.pearson.com/en-us/subject-catalog/p/design-and-analysis-of-spatial-data-structures-the/P200000006297"]]},
{id:"rtree-kdtree",title:"R-trees and k-d trees",level:4,kind:"Indexing",status:"Runnable teaching lab",
 summary:"R-trees index bounding boxes hierarchically for rectangles and arbitrary geometries. k-d trees split space by alternating dimensions for point data. Both support fast nearest-neighbour and range queries.",
 mental:"A tree of nested boxes, or a tree of alternating axis splits",
 mentalText:"R-tree nodes hold bounding boxes of children. k-d tree nodes split on one axis, alternating by depth.",
 steps:["Build the tree from the data.","Query by descending only into nodes that can contain the answer.","For nearest, prune using the node's bounding distance."],
 pseudo:"R-tree:\n  each node has M entries, each entry has a bounding box\n  leaf entries point to actual geometries\n  internal entries point to children\n\n  insert: choose the child whose bbox needs least enlargement\n  split: split the M+1 entries into two groups\n\n  range query (box B):\n    recurse into children whose bbox intersects B\n\n  nearest neighbour:\n    best-first search by minimum distance to bbox\n\nk-d tree:\n  build:\n    choose the axis with maximum spread\n    sort by that axis, pick the median as the pivot\n    recurse on both halves\n\n  range query (box B):\n    if node.point in B: report\n    if B.xmin <= pivot.x: recurse left\n    if B.xmax >= pivot.x: recurse right\n    alternate axis on descent\n\n  nearest neighbour:\n    descend to the leaf containing the query\n    backtrack, checking the other side if the\n    splitting plane is closer than the current best\n\nComplexity:\n  k-d tree: O(log n) average for low dimension\n  R-tree: O(log n) average, sensitive to overlap\n\nCurse of dimensionality:\n  k-d trees degrade to O(n) above ~20 dimensions\n  use ball trees, LSH, or HNSW for high-dimensional data",
 uses:"PostGIS, databases, spatial joins, recommender systems.",
 strength:"Fast for low-dimensional geometric data.",
 limits:"k-d trees degrade in high dimensions. R-trees sensitive to box overlap.",
 pitfall:"Using a k-d tree with a high-dimensional feature vector. It is no faster than a linear scan.",
 question:"Why do k-d trees degrade in high dimensions?",
 answer:"The ratio of nearest to farthest neighbours approaches 1. Pruning rarely eliminates subtrees.",
 demo:"rtree-kd",sample:"200\n5\n3",refs:[
  ["Guttman, R-trees: a dynamic index structure for spatial searching, SIGMOD 1984","https://doi.org/10.1145/602259.602266"],
  ["Bentley, Multidimensional binary search trees used for associative searching, CACM 1975","https://doi.org/10.1145/361002.361007"],
  ["Samet, Foundations of Multidimensional and Metric Data Structures, 2006","https://www.elsevier.com/books/foundations-of-multidimensional-and-metric-data-structures/samet/978-0-12-369446-1"]]},
{id:"geohash-s2-h3",title:"Geohash, S2 and H3",level:4,kind:"Indexing",status:"Runnable teaching lab",
 summary:"Geohash, S2, and H3 are hierarchical spatial hashes that map the Earth's surface to cells with prefix-friendly identifiers. They are used for spatial indexing, tiling, and geographic clustering.",
 mental:"Hash the globe into a grid of cells with string or integer IDs",
 mentalText:"Higher zoom levels mean smaller cells. The ID prefix identifies the parent cell, so nearby cells share prefixes.",
 steps:["Choose the system (Geohash, S2, H3).","Encode a coordinate to a cell ID.","Use prefixes to build a hierarchy.","Query neighbours by cell adjacency."],
 pseudo:"Geohash (base-32):\n  alphabet = '0123456789bcdefghjkmnpqrstuvwxyz'\n  interleave longitude and latitude bits, 5 bits per character\n  longer strings => smaller cells\n\n  precision (chars):  1  2  3   4    5   6    7    8     9\n  cell size (approx): 5000 1250 156 39 4.9 1.2 0.15 0.038 0.0047 km\n\nS2 (Google):\n  project the sphere onto a cube\n  index cells on each face with a Hilbert curve\n  cell ID is a 64-bit integer\n  range queries use the Hilbert curve locality\n\nH3 (Uber):\n  hexagonal grid, hierarchical\n  122 base cells (icosahedral)\n  16 resolutions (0 to 15)\n  each cell has 7 children (1 centre + 6 neighbours)\n  hexagons have uniform distance to all neighbours\n\nComparisons:\n  Geohash:   square cells, easy, no native neighbours\n  S2:        square cells on a cube, Hilbert ordering, complex\n  H3:        hexagonal cells, uniform adjacency, growing adoption\n\nApplications:\n  spatial databases (MongoDB, Elasticsearch)\n  ride-sharing (H3 for trip clustering)\n  map tiling\n  geographic joins",
 uses:"Spatial databases, ride-sharing, geographic joins, clustering.",
 strength:"Compact IDs. Hierarchy with prefix queries. Fast.",
 limits:"Geohash has edge-crossing issues. S2 needs care with face boundaries. H3 cells are not exact hexagons on the sphere.",
 pitfall:"Assuming Geohash prefixes only identify nearby cells. Cells across an edge can have no common prefix.",
 question:"Which system has uniform-distance hexagons?",
 answer:"H3. Every hexagon cell has exactly 6 neighbours at the same distance (ignoring pentagons at the icosahedral vertices).",
 demo:"geohash",sample:"52.5200\n13.4050\n9",refs:[
  ["Niemeyer, Geohash","https://en.wikipedia.org/wiki/Geohash"],
  ["Google, S2 geometry library","http://s2geometry.io/"],
  ["Uber, H3: a hexagonal hierarchical geospatial indexing system","https://h3geo.org/"]]},

{id:"point-in-polygon",title:"Point-in-polygon",level:3,kind:"Query",status:"Runnable teaching lab",
 summary:"The point-in-polygon test determines whether a coordinate lies inside a polygon. Ray casting (even-odd rule) and winding number are the two standard algorithms. Handle edges and vertices carefully.",
 mental:"Count how many times a ray from the point crosses the polygon boundary",
 mentalText:"Cast a ray to the right. If it crosses the boundary an odd number of times, the point is inside. Even means outside.",
 steps:["Choose a ray direction (usually +x).","For each edge, test intersection.","Count intersections.","Odd = inside, even = outside."],
 pseudo:"Ray casting (even-odd rule):\n  inside = false\n  for i in [0..n-1]:\n    j = (i + 1) % n\n    yi, yj = y_i, y_j\n    if (yi > py) != (yj > py):\n      t = (py - yi) / (yj - yi)\n      if px < x_i + t * (x_j - x_i):\n        inside = !inside\n  return inside\n\nWinding number:\n  wn = 0\n  for each edge (p1, p2):\n    if p1.y <= py:\n      if p2.y > py and is_left(p1, p2, p) > 0: wn++\n    else:\n      if p2.y <= py and is_left(p1, p2, p) < 0: wn--\n  return wn != 0\n\nEdge cases:\n  point on an edge\n  point on a vertex\n  ray passing exactly through a vertex\n\nRobust handling:\n  use integer arithmetic\n  or add a tiny random perturbation to the query point\n  or use the winding number with exact predicates\n\nFor polygons with holes:\n  test against each ring\n  point is inside iff inside the outer ring and outside every hole\n\nFor arbitrary geometries:\n  use a spatial library (GEOS, Shapely)",
 uses:"Geofencing, GIS, hit testing, spatial joins.",
 strength:"Simple, O(n) per query.",
 limits:"Slower than an indexed test for large polygons or many queries.",
 pitfall:"Naive ray casting failing on vertices. Use the half-open rule (yi > py) != (yj > py).",
 question:"What does an odd intersection count mean in ray casting?",
 answer:"The point is inside the polygon. Even means outside.",
 demo:"pip",sample:"0 0\n0 0 10 0 10 10 0 10\n5 5",refs:[
  ["Haines, Point in polygon strategies, in Graphics Gems IV, 1994","https://erich.realtimerendering.com/ptinpoly/"],
  ["Shimrat, Algorithm 112: Position of point relative to polygon, CACM 1962","https://doi.org/10.1145/368637.368653"],
  ["O'Rourke, Computational Geometry in C, 2nd ed., Cambridge 1998","https://www.cambridge.org/core/books/computational-geometry-in-c/"]]},
{id:"range-nearest",title:"Range search and nearest feature",level:3,kind:"Query",status:"Runnable teaching lab",
 summary:"Range search returns all features within a distance or bounding box. Nearest feature finds the closest one. Spatial indexes turn both into logarithmic queries.",
 mental:"Filter by distance, then pick the closest",
 mentalText:"A range query prunes by a bounding box or distance bound. The nearest query keeps the current best and prunes nodes farther away.",
 steps:["Choose the query type (range, k-NN).","Use the index to prune.","For range: collect all in range.","For nearest: keep best, prune subtrees farther than best."],
 pseudo:"Range search (radius r from point q):\n  use a spatial index\n  for a node with bbox B:\n    if distance(q, B) > r: skip\n    elif leaf: test each object, keep those within r\n    else: recurse\n\nk-nearest (k-NN):\n  best = priority queue of size k\n  best-first traversal by distance to bbox\n  for each candidate:\n    if queue not full: push\n    elif distance(candidate, q) < max(best): replace max\n\nApproximate nearest neighbour (ANN):\n  use a graph (HNSW), LSH, or a randomized k-d tree\n  trades accuracy for speed\n\nGeodesic nearest:\n  same structure, but distance is Haversine or Vincenty\n  cannot use Euclidean pruning directly\n  bound using spherical or planar approximations\n\nR-tree nearest:\n  bbox distance is a lower bound on the true distance\n  use it to prune\n\nComplexity:\n  range search with an index: O(log n + k)\n  nearest: O(log n) average\n\nUsed by:\n  PostGIS ST_DWithin, ST_Distance\n  Elasticsearch geo_distance\n  MongoDB $near",
 uses:"Store locator, restaurant finder, emergency dispatch, k-NN classification.",
 strength:"Logarithmic with a good index. Simple to reason about.",
 limits:"Geodesic distance complicates pruning. Approximation is often needed.",
 pitfall:"Using a planar index for a global dataset. Distances across the antimeridian or near the poles break.",
 question:"How does a spatial index prune a nearest-neighbour query?",
 answer:"It uses a lower bound on the distance from the query to the node's bounding box. If that lower bound is greater than the current best, the subtree is skipped.",
 demo:"range",sample:"100\n5\n20 20\n10",refs:[
  ["Samet, Foundations of Multidimensional and Metric Data Structures, 2006","https://www.elsevier.com/books/foundations-of-multidimensional-and-metric-data-structures/samet/978-0-12-369446-1"],
  ["Roussopoulos, Kelley, Vincent, Nearest neighbor queries, SIGMOD 1995","https://doi.org/10.1145/223784.223794"],
  ["Malkov and Yashunin, Efficient and robust approximate nearest neighbor search using HNSW graphs, IEEE TPAMI 2020","https://doi.org/10.1109/TPAMI.2018.2889473"]]},
{id:"spatial-joins",title:"Spatial joins and tile indexing",level:4,kind:"Query",status:"Runnable teaching lab",
 summary:"A spatial join combines two datasets by a spatial predicate (intersects, contains, within distance). Tile indexing organises the world into a pyramid of tiles for fast display at multiple zoom levels.",
 mental:"Match features from A with features from B by a spatial relation",
 mentalText:"Spatial joins use a spatial index on one side, then test the predicate against candidates from the other. Tile pyramids let a map show only the relevant detail at each zoom.",
 steps:["Build a spatial index on one dataset.","For each feature in the other, query the index.","Test the predicate.","For tiles: pick a zoom level, compute tile coordinates, fetch only visible tiles."],
 pseudo:"Spatial join:\n  build R-tree on A\n  for each b in B:\n    candidates = A.query(b.bbox)\n    for a in candidates:\n      if predicate(a, b): emit(a, b)\n\nPredicates:\n  intersects\n  contains\n  within\n  touches\n  crosses\n  overlaps\n  distance < r\n\nTile pyramid (XYZ):\n  zoom z in [0, 22]\n  n = 2^z tiles per side\n  tile (x, y) covers lon in [lon(x), lon(x+1)] and lat in [lat(y+1), lat(y)]\n  lon(x) = x / n * 360 - 180\n  lat(y) = atan(sinh(pi * (1 - 2 y / n))) * 180 / pi\n\n  a tile has up to 4 children at zoom z+1:\n    (2x, 2y), (2x+1, 2y), (2x, 2y+1), (2x+1, 2y+1)\n\n  a tile has one parent at zoom z-1:\n    (floor(x/2), floor(y/2))\n\nVector tiles:\n  MVT (Mapbox Vector Tile) format\n  simplified geometries per zoom\n\nRaster tiles:\n  PNG or JPEG at a fixed size (256 or 512 px)\n\nTile server performance:\n  pre-render at low zooms\n  cache at high zooms\n  render on demand for the long tail",
 uses:"GIS overlays, map rendering, data integration.",
 strength:"General, well-understood, supported by every spatial database.",
 limits:"Can be expensive for large datasets. Tile pyramid needs storage.",
 pitfall:"Comparing raw geometries without an index. Quadratic time.",
 question:"How many children does a tile have at the next zoom level?",
 answer:"Four. Each tile (x, y, z) splits into (2x, 2y), (2x+1, 2y), (2x, 2y+1), (2x+1, 2y+1) at zoom z+1.",
 demo:"spatial-join",sample:"50\n5\n0 0 20 20\n30",refs:[
  ["OGC, Simple Features specification","https://www.ogc.org/standards/sfa"],
  ["PostGIS, spatial relationships","https://postgis.net/docs/reference.html"],
  ["Mapbox, Vector Tile Specification","https://docs.mapbox.com/vector-tiles/specification/"]]},

{id:"dem-slope-aspect",title:"DEM, slope and aspect",level:3,kind:"Terrain",status:"Runnable teaching lab",
 summary:"A digital elevation model (DEM) is a raster of elevation values. Slope is the rate of change of elevation. Aspect is the compass direction of steepest descent. Both are computed from local derivatives.",
 mental:"The steepness and the direction of the downhill",
 mentalText:"Slope is the magnitude of the gradient. Aspect is the direction of the gradient, measured clockwise from north.",
 steps:["For each cell, compute the east and north derivatives.","Slope = atan(sqrt(dz/dx^2 + dz/dy^2)).","Aspect = atan2(dz/dy, -dz/dx).","Convert to degrees."],
 pseudo:"3x3 neighbourhood (Horn's method):\n  a b c\n  d e f\n  g h i\n\n  dz/dx = ((c + 2f + i) - (a + 2d + g)) / (8 * cell_size)\n  dz/dy = ((g + 2h + i) - (a + 2b + c)) / (8 * cell_size)\n\n  slope = atan(sqrt((dz/dx)^2 + (dz/dy)^2)) * 180 / pi\n\n  aspect = atan2(dz/dy, -dz/dx)\n  if aspect < 0: aspect += 2 pi\n  aspect in [0, 2 pi)\n\nAspect conventions:\n  0 = north, pi/2 = east, pi = south, 3 pi/2 = west\n  flat areas have undefined aspect (slope = 0)\n\nEdge handling:\n  replicate, wrap, or ignore\n  ignore reduces the valid output to (n-2) x (m-2)\n\nDEM sources:\n  SRTM (30 m, 2000)\n  ASTER GDEM (30 m)\n  Copernicus DEM (30 m)\n  LiDAR-derived DEMs (sub-metre)\n\nUnits:\n  slope in degrees or percent\n  percent = tan(radians) * 100\n\nApplications:\n  hydrology (flow direction)\n  solar siting (aspect)\n  slope stability\n  line-of-sight analysis",
 uses:"Hydrology, solar energy, geomorphology, engineering.",
 strength:"Simple, well-defined, fast.",
 limits:"Noisy DEMs give noisy derivatives. Smooth first.",
 pitfall:"Computing slope on a raw noisy DEM. Smoothing is usually needed.",
 question:"What does aspect = 180° mean?",
 answer:"The slope faces south. The steepest descent direction is south.",
 demo:"dem",sample:"20\n20\n5",refs:[
  ["Horn, Hill shading and the reflectance map, Proc. IEEE 1981","https://doi.org/10.1109/PROC.1981.11918"],
  ["Burrough and McDonnell, Principles of Geographical Information Systems, 3rd ed., Oxford 2015","https://global.oup.com/academic/product/principles-of-geographical-information-systems-9780198742845"],
  ["Zevenbergen and Thorne, Quantitative analysis of land surface topography, Earth Surface Processes 1987","https://doi.org/10.1002/esp.3290120107"]]},
{id:"hillshade",title:"Hillshade",level:4,kind:"Terrain",status:"Runnable teaching lab",
 summary:"Hillshade renders a DEM as a shaded relief by simulating illumination from a sun position. It combines the slope and aspect with the sun's azimuth and altitude using Lambert's cosine law.",
 mental:"A grayscale image where slopes facing the sun are bright",
 mentalText:"The brightness of each cell is proportional to the cosine of the angle between the surface normal and the direction to the sun.",
 steps:["Compute the slope and aspect.","Compute the sun's azimuth and altitude.","Compute the cosine of the incidence angle.","Scale to 0-255."],
 pseudo:"Lambertian hillshade:\n  zenith = (90 - altitude) in radians\n  azimuth_math = (360 - sun_azimuth + 90) mod 360\n  azimuth_math in radians\n\n  slope_r = slope in radians\n  aspect_r = aspect in radians\n\n  shaded = cos(zenith) cos(slope_r) + sin(zenith) sin(slope_r) cos(azimuth_math - aspect_r)\n\n  gray = shaded * 255, clipped to [0, 255]\n\nStandard sun position:\n  azimuth = 315° (northwest)\n  altitude = 45°\n\nMultidirectional hillshade:\n  average hillshades from several sun positions\n  reduces bias and looks better\n\nSky-view factor:\n  fraction of sky visible from each cell\n  useful for solar, urban climate, and archaeological prospection\n\nAnalytical hillshade:\n  an alternative formula using dz/dx, dz/dy directly\n  same physical model, different algebra\n\nApplications:\n  topographic maps\n  solar potential\n  archaeological feature detection (LIDAR)\n  terrain visualization",
 uses:"Cartography, archaeology, solar siting, geology.",
 strength:"Simple, physical, well understood.",
 limits:"Sensitive to DEM noise. Single-direction shading biases interpretation.",
 pitfall:"Using a single sun direction. Features perpendicular to the light are invisible. Use multidirectional shading.",
 question:"What sun position is standard for hillshade?",
 answer:"Azimuth 315° (northwest) and altitude 45°. This convention avoids the confusing 'crater' illusion.",
 demo:"hillshade",sample:"20\n20\n315\n45",refs:[
  ["Horn, Hill shading and the reflectance map, Proc. IEEE 1981","https://doi.org/10.1109/PROC.1981.11918"],
  ["ESRI, How hillshade works","https://pro.arcgis.com/en/pro-app/latest/tool-reference/3d-analyst/how-hillshade-works.htm"],
  ["Zakšek, Oštir, Kokalj, Sky-view factor as a relief visualization technique, Remote Sensing 2011","https://doi.org/10.3390/rs3020398"]]},
{id:"viewshed-watershed",title:"Viewshed and watershed",level:5,kind:"Terrain",status:"Runnable teaching lab",
 summary:"A viewshed identifies the cells visible from an observer. A watershed delineates the area draining to a common outlet. Both use the DEM and neighbourhood operations.",
 mental:"Line of sight for viewshed; downhill flow for watershed",
 mentalText:"Viewshed traces rays from the observer. Watershed assigns each cell to its downstream outlet using flow direction.",
 steps:["Viewshed: for each cell, trace a line to the observer.","Check if the terrain blocks the line.","Mark visible or not.","Watershed: compute flow direction, then flow accumulation, then delineate basins."],
 pseudo:"Viewshed (line-of-sight):\n  for each target cell:\n    sample the DEM along the segment from observer to target\n    for each sample s:\n      angle_s = atan((z_s - z_obs) / dist_s)\n      if angle_s > max_angle_so_far: not visible\n      else: update max_angle_so_far\n    visible if no sample exceeds the current max angle\n\nBresenham line for raster traversal.\n\nFlow direction (D8):\n  for each cell:\n    find the steepest descent among the 8 neighbours\n    encode as a direction (1, 2, 4, 8, 16, 32, 64, 128)\n\nFlow accumulation:\n  for each cell, count upstream cells\n  computed by topological traversal of the flow graph\n\nWatershed delineation:\n  choose outlets\n  trace upstream via the flow direction grid\n  each cell belongs to the basin of the outlet it drains to\n\nVariants:\n  D-infinity (Tarboton): flow is distributed\n  multiple-flow-direction (MFD)\n  priority-flood for depression filling",
 uses:"Solar siting, telecom, defence, hydrology, erosion modelling.",
 strength:"Directly answers practical questions.",
 limits:"Viewshed is O(n) per observer. Watershed needs a depression-filled DEM.",
 pitfall:"Running watershed on a DEM with sinks. Fill or breach depressions first.",
 question:"What is flow accumulation?",
 answer:"The number of upstream cells that drain to a given cell. Ridges have accumulation 1, channels have high accumulation.",
 demo:"viewshed",sample:"20\n20\n10 10\n5",refs:[
  ["Tarboton, A new method for the determination of flow directions and upslope areas in grid digital elevation models, Water Resources Research 1997","https://doi.org/10.1029/96WR03137"],
  ["O'Callaghan and Mark, The extraction of drainage networks from digital elevation data, Computer Vision, Graphics, and Image Processing 1984","https://doi.org/10.1016/S0734-189X(84)80011-0"],
  ["Fisher, First experiments in viewshed uncertainty, Photogrammetric Engineering and Remote Sensing 1991","https://www.asprs.org/"]]},

{id:"nearest-idw",title:"Nearest neighbour and inverse distance weighting",level:3,kind:"Interpolation",status:"Runnable teaching lab",
 summary:"Nearest neighbour assigns the value of the closest sample. Inverse distance weighting (IDW) interpolates as a weighted average where weights decrease with distance. Both are local, deterministic interpolators.",
 mental:"Copy the closest value, or average with distance-based weights",
 mentalText:"IDW with power p gives more influence to closer points. Higher p means more local, lower p means smoother.",
 steps:["For each query point, find nearby samples.","For nearest: pick the closest.","For IDW: compute weights w_i = 1 / d_i^p.","Normalise and average."],
 pseudo:"Nearest neighbour:\n  for each query point q:\n    find sample s minimizing distance(q, s)\n    value(q) = value(s)\n\nInverse distance weighting:\n  value(q) = sum_i w_i v_i / sum_i w_i\n  w_i = 1 / distance(q, s_i)^p\n\n  p = 1: smooth, global\n  p = 2: standard, local\n  p = 4: very local, may be piecewise constant\n\nExactness:\n  IDW is exact at sample points (limit as d -> 0)\n\nRange of influence:\n  limit to the k nearest samples or a radius r\n  avoids the smoothing of far samples\n\nDirectional bias:\n  plain IDW puts bull's-eye patterns around samples\n  use gradient-modified IDW or kriging for better results\n\nComplexity:\n  naive: O(n m) for n queries, m samples\n  with a k-d tree or grid: O(n log m)\n\nApplications:\n  temperature and rainfall maps\n  pollution interpolation\n  elevation from sparse samples\n  DEM filling",
 uses:"Environmental mapping, meteorology, GIS analysis.",
 strength:"Simple, exact at sample points, fast.",
 limits:"Bull's-eye artefacts. Cannot extrapolate trends. Ignores sample configuration.",
 pitfall:"Using IDW on a clustered sample set. Clusters dominate the estimate.",
 question:"What does increasing p in IDW do?",
 answer:"It makes the interpolation more local. At p → ∞, IDW becomes nearest neighbour.",
 demo:"idw",sample:"20\n20\n8\n2.0\n5",refs:[
  ["Shepard, A two-dimensional interpolation function for irregularly-spaced data, ACM 1968","https://doi.org/10.1145/800186.810616"],
  ["Isaaks and Srivastava, An Introduction to Applied Geostatistics, Oxford 1989","https://global.oup.com/academic/product/an-introduction-to-applied-geostatistics-9780195050134"],
  ["Li and Heap, A review of comparative studies of spatial interpolation methods, Environmental Modelling & Software 2011","https://doi.org/10.1016/j.envsoft.2010.12.008"]]},
{id:"kriging",title:"Kriging",level:5,kind:"Interpolation",status:"Concept lesson",
 summary:"Kriging is a geostatistical interpolator that models spatial correlation through a variogram. It provides best linear unbiased predictions with an estimate of uncertainty.",
 mental:"Weighted average where weights come from a spatial correlation model",
 mentalText:"The variogram describes how variance grows with distance. Kriging solves a linear system that uses the variogram to give optimal weights.",
 steps:["Estimate the experimental variogram from samples.","Fit a theoretical variogram model.","For each query, set up and solve the kriging system.","Compute the estimate and the kriging variance."],
 pseudo:"Variogram:\n  gamma(h) = 0.5 * mean((z(s_i) - z(s_j))^2) over pairs with |s_i - s_j| ~ h\n\n  model: nugget, sill, range\n  spherical: gamma(h) = nugget + (sill - nugget) * (1.5 h / r - 0.5 (h/r)^3)\n  exponential: gamma(h) = nugget + (sill - nugget) * (1 - exp(-h/r))\n  Gaussian: gamma(h) = nugget + (sill - nugget) * (1 - exp(-(h/r)^2))\n\nKriging system (ordinary kriging):\n  for each pair (i, j): Gamma_ij = gamma(|s_i - s_j|)\n  unknowns: weights w_i and Lagrange multiplier mu\n\n  [ Gamma  1 ] [ w ]   [ gamma_0 ]\n  [ 1^T    0 ] [ mu] = [ 1       ]\n\n  estimate: z_hat = sum_i w_i z_i\n  variance: sigma^2 = sum_i w_i gamma_0i + mu\n\nVariants:\n  simple kriging:  known mean\n  ordinary kriging: unknown constant mean\n  universal kriging: mean is a trend surface\n  co-kriging:       two correlated variables\n  regression kriging: regression + kriging on residuals\n\nComplexity:\n  O(n^3) to solve the kriging system per query\n  with a moving neighbourhood: O(k^3)\n\nApplications:\n  mining grade estimation\n  soil mapping\n  air quality\n  hydrology\n  precision agriculture",
 uses:"Mining, environmental science, precision agriculture.",
 strength:"Optimal under its assumptions. Provides uncertainty.",
 limits:"Requires a variogram. Slow for many samples.",
 pitfall:"Assuming kriging is always best. Without a good variogram it can be worse than IDW.",
 question:"What is the nugget in a variogram?",
 answer:"The variance at zero distance. It represents measurement error and micro-scale variation.",
 demo:"none",sample:"",refs:[
  ["Matheron, Principles of geostatistics, Economic Geology 1963","https://doi.org/10.2113/gsecongeo.58.8.1246"],
  ["Cressie, Statistics for Spatial Data, Wiley 1993","https://www.wiley.com/en-us/Statistics+for+Spatial+Data%2C+Revised+Edition-p-9780471002550"],
  ["Journel and Huijbregts, Mining Geostatistics, Academic Press 1978","https://www.elsevier.com/books/mining-geostatistics/journel/978-0-12-391050-9"]]},
{id:"spline",title:"Spline interpolation",level:4,kind:"Interpolation",status:"Runnable teaching lab",
 summary:"Spline interpolation fits a smooth function through the data. Cubic splines are piecewise cubic polynomials with continuous first and second derivatives. Thin-plate splines generalise to 2D.",
 mental:"A smooth curve through the points",
 mentalText:"Cubic splines are the smoothest interpolant in 1D. In 2D, thin-plate splines minimise bending energy.",
 steps:["Set up the spline system.","Solve for the coefficients.","Evaluate at query points.","For 2D, use a radial basis function."],
 pseudo:"Cubic spline (natural):\n  segments S_i(x) on [x_i, x_{i+1}]\n  S_i(x) = a_i + b_i (x - x_i) + c_i (x - x_i)^2 + d_i (x - x_i)^3\n\n  constraints:\n    S_i(x_{i+1}) = S_{i+1}(x_{i+1})     continuity\n    S_i'(x_{i+1}) = S_{i+1}'(x_{i+1})   C1\n    S_i''(x_{i+1}) = S_{i+1}''(x_{i+1}) C2\n    S_0''(x_0) = 0, S_{n-1}''(x_n) = 0 (natural)\n\n  solve tridiagonal system for second derivatives M_i\n  back-substitute for a, b, c, d\n\nThin-plate spline (2D):\n  f(x) = a_0 + a_1 x + a_2 y + sum_i w_i phi(|x - x_i|)\n  phi(r) = r^2 log(r)\n  solve the system for a and w\n\nRadial basis functions (RBF):\n  phi(r): multiquadric, inverse multiquadric, Gaussian, thin-plate\n\nInterpolation vs smoothing:\n  interpolating splines pass through every point\n  smoothing splines trade off fit and smoothness\n\nApplications:\n  terrain smoothing\n  track generation\n  surfaces from scattered data\n  medical imaging",
 uses:"Terrain, surfaces, tracks, medical imaging.",
 strength:"Smooth. Exact at sample points for interpolating splines.",
 limits:"Overshoot near sharp changes. Global effect for thin-plate splines.",
 pitfall:"Using interpolating splines on noisy data. Overshoot and ringing. Use smoothing splines.",
 question:"What is the key property of a natural cubic spline?",
 answer:"It minimises the integral of the squared second derivative among all interpolating functions. It is the smoothest interpolant.",
 demo:"spline",sample:"0 0\n1 1\n2 0\n3 2\n4 0\n1.5 2.5 3.5",refs:[
  ["de Boor, A Practical Guide to Splines, revised ed., Springer 2001","https://link.springer.com/book/10.1007/978-1-4612-6333-3"],
  ["Duchon, Splines minimizing rotation-invariant semi-norms in Sobolev spaces, 1977","https://doi.org/10.1007/BFb0086566"],
  ["Wahba, Spline Models for Observational Data, SIAM 1990","https://doi.org/10.1137/1.9781611970128"]]},

{id:"dijkstra-astar",title:"Dijkstra and A* on road networks",level:4,kind:"Routing",status:"Runnable teaching lab",
 summary:"Dijkstra computes shortest paths from a source. A* uses a heuristic to focus the search toward a target. On road networks, both are too slow for continental queries without further optimisation.",
 mental:"Expand the closest unexplored node, or the one that looks closest to the target",
 mentalText:"Dijkstra expands nodes by distance from the source. A* expands by distance plus a heuristic estimate to the target.",
 steps:["Initialise distances.","Use a priority queue.","Pop the minimum.","Relax outgoing edges.","A*: add a heuristic h(n) to the priority."],
 pseudo:"Dijkstra:\n  dist[s] = 0\n  pq = min-heap on dist\n  while pq:\n    u = pop minimum\n    if u == t: stop\n    for each edge (u, v, w):\n      if dist[u] + w < dist[v]:\n        dist[v] = dist[u] + w\n        prev[v] = u\n        push v\n\nA*:\n  priority = dist[u] + h(u, t)\n  same algorithm, different priority\n\nHeuristics for road networks:\n  great-circle distance / max speed\n  landmark-based (ALT): precompute distances to landmarks\n\nComplexity:\n  Dijkstra: O((V + E) log V)\n  A*: same, but fewer nodes expanded\n\nEdge weights:\n  travel time (preferred)\n  distance\n  fuel or toll cost\n\nOne-to-many:\n  run Dijkstra from the source, stop when all targets are settled\n\nBidirectional:\n  run Dijkstra forward from s and backward from t\n  stop when the two frontiers meet\n\nContraction hierarchies (next lesson):\n  preprocess the graph to accelerate queries by 100-1000x",
 uses:"Navigation, logistics, ride-hailing, game AI.",
 strength:"Correct. Simple to implement.",
 limits:"Too slow for continental road networks without preprocessing.",
 pitfall:"Using A* with an inadmissible heuristic. The shortest path is not guaranteed.",
 question:"Why does A* expand fewer nodes than Dijkstra?",
 answer:"The heuristic h(n) biases expansion toward the target. Nodes far from the target have higher priority values and stay in the queue.",
 demo:"dijkstra",sample:"6\n7\n0 1 1\n0 2 4\n1 2 2\n1 3 5\n2 3 1\n3 4 3\n3 5 7\n4 5 1\n0\n5",refs:[
  ["Dijkstra, A note on two problems in connexion with graphs, Numerische Mathematik 1959","https://doi.org/10.1007/BF01386390"],
  ["Hart, Nilsson, Raphael, A formal basis for the heuristic determination of minimum cost paths, IEEE SSC 1968","https://doi.org/10.1109/TSSC.1968.300136"],
  ["Bast et al., Route planning in transportation networks, 2015","https://arxiv.org/abs/1504.05140"]]},
{id:"contraction-hierarchies",title:"Contraction hierarchies and preprocessing",level:5,kind:"Routing",status:"Concept lesson",
 summary:"Contraction hierarchies preprocess a road network by assigning each node an importance level. Queries search upward from source and target and meet at the top. Speedup is 100-1000x over Dijkstra.",
 mental:"Build a hierarchy of important nodes, then search only in that hierarchy",
 mentalText:"Preprocessing orders nodes by importance. The query searches only edges that go from lower to higher importance, and from higher back down.",
 steps:["Iteratively contract the least important node.","Add shortcut edges to preserve shortest paths.","Assign each node a level.","At query time, run bidirectional Dijkstra using only upward edges."],
 pseudo:"Preprocessing (node contraction):\n  repeat until all nodes contracted:\n    pick the node u with the fewest edges\n    for each pair (v, w) of neighbours of u:\n      if the shortest v-w path goes through u:\n        add a shortcut edge (v, w) with weight d(v, u) + d(u, w)\n    remove u from the graph\n    assign u a level = current contraction order\n\nQuery:\n  run bidirectional Dijkstra\n  forward search uses only edges u -> v where level(u) < level(v)\n  backward search uses only edges u -> v where level(u) > level(v)\n  stop when the frontiers meet or the queue minimum exceeds best\n\nSpeedup:\n  100-1000x over plain Dijkstra\n  preprocessing takes minutes for continental networks\n\nVariants:\n  contraction hierarchies + edge filtering\n  hub labels\n  transit node routing (for very fast queries)\n  customizable route planning (traffic-aware)\n\nApplications:\n  OSRM\n  Graphhopper\n  OpenTripPlanner\n  commercial routing engines",
 uses:"Production routing engines, logistics, ride-hailing.",
 strength:"Enormous query speedup.",
 limits:"Preprocessing is expensive. Customisation for traffic is non-trivial.",
 pitfall:"Ignoring turn restrictions during preprocessing. Shortcuts can violate them.",
 question:"Why does contraction hierarchies work?",
 answer:"Road networks have a natural hierarchy: motorways, arterial roads, local streets. Contraction respects this structure.",
 demo:"none",sample:"",refs:[
  ["Geisberger et al., Contraction hierarchies: faster and simpler hierarchical routing in road networks, WEA 2008","https://doi.org/10.1007/978-3-540-68552-4_24"],
  ["Bast et al., Route planning in transportation networks, 2015","https://arxiv.org/abs/1504.05140"],
  ["OSRM, Open Source Routing Machine","http://project-osrm.org/"]]},
{id:"map-matching-hmm",title:"Map matching with hidden Markov models",level:5,kind:"GPS",status:"Concept lesson",
 summary:"Map matching aligns a noisy GPS trace to the road network. HMM-based matching models the true road as a hidden state and the GPS fix as an observation. Viterbi finds the most likely road sequence.",
 mental:"Guess the road, given noisy GPS fixes",
 mentalText:"Each GPS fix has several candidate roads. The HMM scores transitions by how plausible the movement is, and finds the most likely path.",
 steps:["Find candidate roads near each GPS fix.","Compute emission probabilities.","Compute transition probabilities between candidates.","Run Viterbi to find the best path."],
 pseudo:"Hidden Markov model:\n  states: candidate road segments at each time step\n  observations: GPS fixes\n\nEmission probability:\n  P(obs | state) proportional to exp(-distance^2 / (2 sigma^2))\n  sigma = GPS accuracy (typically 5-20 m)\n\nTransition probability:\n  P(state_t | state_{t-1}) proportional to exp(-|d_route - d_gps| / beta)\n  d_route = route distance between the two candidate segments\n  d_gps = great-circle distance between the two fixes\n  beta = tuning parameter\n\nViterbi:\n  for each state at time t:\n    score = max over previous states of (prev_score + log transition) + log emission\n  backtrack from the best state at the end\n\nOnline variants:\n  sliding window HMM\n  particle filters\n\nPost-processing:\n  enforce turn restrictions\n  snap to lane-level detail when available\n\nAccuracy:\n  HMM matching achieves >99% correct road on good GPS\n  degrades with urban canyons, tunnels, and sparse traces",
 uses:"Fleet telematics, fitness apps, traffic analysis, autonomous driving.",
 strength:"Robust to noise. Principled probabilistic framework.",
 limits:"Requires a good road network. Slow for very long traces without pruning.",
 pitfall:"Ignoring turn restrictions. The matched path may make illegal turns.",
 question:"What are the hidden states in HMM map matching?",
 answer:"The true road segments. The GPS fixes are observations, not states.",
 demo:"none",sample:"",refs:[
  ["Newson and Krumm, Hidden Markov map matching through noise and sparseness, SIGSPATIAL 2009","https://doi.org/10.1145/1653771.1653818"],
  ["Quddus, Ochieng, Noland, Current map-matching algorithms for transport applications, Transportation Research Part C 2007","https://doi.org/10.1016/j.trc.2007.02.001"],
  ["Valhalla, map matching with HMM","https://github.com/valhalla/valhalla"]]},
{id:"douglas-peucker",title:"Douglas-Peucker and GPS smoothing",level:3,kind:"GPS",status:"Runnable teaching lab",
 summary:"Douglas-Peucker simplifies a polyline by keeping points that define its shape. It is recursive: keep the endpoints, find the point farthest from the segment, recurse if it exceeds a tolerance. GPS smoothing removes noise before or after simplification.",
 mental:"Keep the points that matter, drop the ones that do not",
 mentalText:"Start with the endpoints. Find the farthest point. If it is farther than the tolerance, keep it and recurse on both halves.",
 steps:["Keep the endpoints.","Find the point with maximum perpendicular distance.","If distance > tolerance, keep the point and recurse.","Otherwise drop all intermediate points."],

const D2R = Math.PI / 180;
const R_EARTH = 6371008.8; // metres

function haversine(lat1, lon1, lat2, lon2){
 const phi1 = lat1 * D2R, phi2 = lat2 * D2R;
 const dphi = (lat2 - lat1) * D2R;
 const dlambda = (lon2 - lon1) * D2R;
 const a = Math.sin(dphi/2)**2 + Math.cos(phi1) * Math.cos(phi2) * Math.sin(dlambda/2)**2;
 const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
 return R_EARTH * c;
}
function initialBearing(lat1, lon1, lat2, lon2){
 const phi1 = lat1 * D2R, phi2 = lat2 * D2R;
 const dl = (lon2 - lon1) * D2R;
 const y = Math.sin(dl) * Math.cos(phi2);
 const x = Math.cos(phi1) * Math.sin(phi2) - Math.sin(phi1) * Math.cos(phi2) * Math.cos(dl);
 let t = Math.atan2(y, x) / D2R;
 if (t < 0) t += 360;
 return t;
}
function vincenty(lat1, lon1, lat2, lon2){
 // WGS-84
 const a = 6378137.0, f = 1 / 298.257223563;
 const b = (1 - f) * a;
 const phi1 = lat1 * D2R, phi2 = lat2 * D2R;
 const L = (lon2 - lon1) * D2R;
 const U1 = Math.atan((1 - f) * Math.tan(phi1));
 const U2 = Math.atan((1 - f) * Math.tan(phi2));
 const sinU1 = Math.sin(U1), cosU1 = Math.cos(U1);
 const sinU2 = Math.sin(U2), cosU2 = Math.cos(U2);
 let lambda = L;
 let lambdaPrev = 0;
 let iterations = 0;
 const maxIter = 200;
 let sinSigma = 0, cosSigma = 0, sigma = 0, sinAlpha = 0, cos2Alpha = 0, cos2SigmaM = 0;
 while (Math.abs(lambda - lambdaPrev) > 1e-12 && iterations < maxIter){
  const sinLambda = Math.sin(lambda), cosLambda = Math.cos(lambda);
  sinSigma = Math.sqrt((cosU2 * sinLambda)**2 + (cosU1 * sinU2 - sinU1 * cosU2 * cosLambda)**2);
  if (sinSigma === 0) return { distance: 0, initialBearing: 0, finalBearing: 0, iterations };
  cosSigma = sinU1 * sinU2 + cosU1 * cosU2 * cosLambda;
  sigma = Math.atan2(sinSigma, cosSigma);
  sinAlpha = cosU1 * cosU2 * sinLambda / sinSigma;
  cos2Alpha = 1 - sinAlpha**2;
  cos2SigmaM = cos2Alpha === 0 ? 0 : cosSigma - 2 * sinU1 * sinU2 / cos2Alpha;
  const C = f / 16 * cos2Alpha * (4 + f * (4 - 3 * cos2Alpha));
  lambdaPrev = lambda;
  lambda = L + (1 - C) * f * sinAlpha * (sigma + C * sinSigma * (cos2SigmaM + C * cosSigma * (-1 + 2 * cos2SigmaM**2)));
  iterations++;
 }
 const u2 = cos2Alpha * (a**2 - b**2) / (b**2);
 const A = 1 + u2/16384 * (4096 + u2 * (-768 + u2 * (320 - 175 * u2)));
 const B = u2/1024 * (256 + u2 * (-128 + u2 * (74 - 47 * u2)));
 const dsigma = B * sinSigma * (cos2SigmaM + B/4 * (cosSigma * (-1 + 2 * cos2SigmaM**2) - B/6 * cos2SigmaM * (-3 + 4 * sinSigma**2) * (-3 + 4 * cos2SigmaM**2)));
 const s = b * A * (sigma - dsigma);
 // initial and final bearing
 const alpha1 = Math.atan2(cosU2 * Math.sin(lambda), cosU1 * sinU2 - sinU1 * cosU2 * Math.cos(lambda));
 const alpha2 = Math.atan2(cosU1 * Math.sin(lambda), -sinU1 * cosU2 + cosU1 * sinU2 * Math.cos(lambda));
 let ib = alpha1 / D2R; if (ib < 0) ib += 360;
 let fb = alpha2 / D2R; if (fb < 0) fb += 360;
 return { distance: s, initialBearing: ib, finalBearing: fb, iterations };
}
function metersPerDegree(lat){
 const phi = lat * D2R;
 const mPerDegLat = 111132.92 - 559.82 * Math.cos(2*phi) + 1.175 * Math.cos(4*phi) - 0.0023 * Math.cos(6*phi);
 const mPerDegLon = 111412.84 * Math.cos(phi) - 93.5 * Math.cos(3*phi) + 0.118 * Math.cos(5*phi);
 return { lat: mPerDegLat, lon: mPerDegLon };
}
function webMercator(lat, lon){
 const x = R_EARTH * lon * D2R;
 const y = R_EARTH * Math.log(Math.tan(Math.PI/4 + lat * D2R / 2));

}
function inverseWebMercator(x, y){
 const lon = x / R_EARTH / D2R;

}
function tileFromLatLon(lat, lon, z){
 const n = Math.pow(2, z);
 const xt = Math.floor((lon + 180) / 360 * n);
 const latR = lat * D2R;

}
function utmZone(lon){

function utmApprox(lat, lon, zone, k0){

 const N = a / Math.sqrt(1 - e2 * Math.sin(phi)**2);
 const T = Math.tan(phi)**2;
 const ePrime2 = e2 / (1 - e2);
 const C = ePrime2 * Math.cos(phi)**2;
 const A = (lam - lam0) * Math.cos(phi);
 const M = a * ((1 - e2/4 - 3*e2*e2/64) * phi - (3*e2/8 + 3*e2*e2/32) * Math.sin(2*phi) + (15*e2*e2/256) * Math.sin(4*phi));
 let x = k0 * N * (A + (1 - T + C) * A**3 / 6 + (5 - 18*T + T*T + 72*C - 58*ePrime2) * A**5 / 120);
 let y = k0 * (M + N * Math.tan(phi) * (A*A/2 + (5 - T + 9*C + 4*C*C) * A**4 / 24 + (61 - 58*T + T*T + 600*C - 330*ePrime2) * A**6 / 720));
 x += 500000;
 if (lat < 0) y += 10000000;
 return { x, y, zone, hemisphere: lat >= 0 ? 'N' : 'S' };
}
function lambertAzimuthalEqualArea(lat, lon, lat0, lon0){
 const phi = lat * D2R, phi0 = lat0 * D2R, dl = (lon - lon0) * D2R;
 const denom = 1 + Math.sin(phi0) * Math.sin(phi) + Math.cos(phi0) * Math.cos(phi) * Math.cos(dl);
 if (denom < 1e-12) return { x: 0, y: 0 };
 const k = Math.sqrt(2 / denom);
 const x = R_EARTH * k * Math.cos(phi) * Math.sin(dl);
 const y = R_EARTH * k * (Math.cos(phi0) * Math.sin(phi) - Math.sin(phi0) * Math.cos(phi) * Math.cos(dl));
 return { x, y };
}
const GEOHASH_ALPHABET = '0123456789bcdefghjkmnpqrstuvwxyz';
function geohashEncode(lat, lon, precision){
 let latMin = -90, latMax = 90, lonMin = -180, lonMax = 180;
 let hash = '';
 let bit = 0, ch = 0;
 let even = true;
 while (hash.length < precision){
  if (even){
   const mid = (lonMin + lonMax) / 2;
   if (lon > mid){ ch = (ch << 1) | 1; lonMin = mid; }
   else { ch = ch << 1; lonMax = mid; }
  } else {
   const mid = (latMin + latMax) / 2;
   if (lat > mid){ ch = (ch << 1) | 1; latMin = mid; }
   else { ch = ch << 1; latMax = mid; }
  }
  even = !even;
  if (++bit === 5){
   hash += GEOHASH_ALPHABET[ch];
   bit = 0; ch = 0;
  }
 }
 return hash;
}
function pointInPolygon(px, py, poly){
 let inside = false;
 const n = poly.length;
 for (let i = 0, j = n - 1; i < n; j = i++){
  const xi = poly[i][0], yi = poly[i][1];
  const xj = poly[j][0], yj = poly[j][1];
  if ((yi > py) !== (yj > py)){
   const xint = xi + (py - yi) / (yj - yi) * (xj - xi);
   if (px < xint) inside = !inside;
  }
 }
 return inside;
}
function perpDistance(p, a, b){
 const dx = b[0] - a[0], dy = b[1] - a[1];
 const denom = Math.hypot(dx, dy);
 if (denom === 0) return Math.hypot(p[0] - a[0], p[1] - a[1]);
 return Math.abs(dy * p[0] - dx * p[1] + b[0] * a[1] - b[1] * a[0]) / denom;
}
function douglasPeucker(points, tol){
 if (points.length < 3) return points.slice();
 let dmax = 0, index = 0;
 const first = points[0], last = points[points.length - 1];
 for (let i = 1; i < points.length - 1; i++){
  const d = perpDistance(points[i], first, last);
  if (d > dmax){ dmax = d; index = i; }
 }
 if (dmax > tol){
  const left = douglasPeucker(points.slice(0, index + 1), tol);
  const right = douglasPeucker(points.slice(index), tol);
  return left.slice(0, -1).concat(right);
 }
 return [first, last];
}
function demSlopeAspect(grid, cellSize){
 const rows = grid.length, cols = grid[0].length;
 const slope = Array.from({length: rows}, () => new Array(cols).fill(NaN));
 const aspect = Array.from({length: rows}, () => new Array(cols).fill(NaN));
 for (let r = 1; r < rows - 1; r++){
  for (let c = 1; c < cols - 1; c++){
   const a = grid[r-1][c-1], b = grid[r-1][c], cc = grid[r-1][c+1];
   const d = grid[r][c-1], f = grid[r][c+1];
   const g = grid[r+1][c-1], h = grid[r+1][c], i = grid[r+1][c+1];
   const dzdx = ((cc + 2*f + i) - (a + 2*d + g)) / (8 * cellSize);
   const dzdy = ((g + 2*h + i) - (a + 2*b + cc)) / (8 * cellSize);
   const s = Math.atan(Math.hypot(dzdx, dzdy)) / D2R;
   let asp = Math.atan2(dzdy, -dzdx) / D2R;
   if (asp < 0) asp += 360;
   slope[r][c] = s;
   aspect[r][c] = asp;
  }
 }
 return { slope, aspect };
}
function hillshadeFromDEM(grid, cellSize, sunAz, sunAlt){
 const { slope, aspect } = demSlopeAspect(grid, cellSize);
 const rows = grid.length, cols = grid[0].length;
 const out = Array.from({length: rows}, () => new Array(cols).fill(0));
 const zenith = (90 - sunAlt) * D2R;
 const azMath = (360 - sunAz + 90) % 360 * D2R;
 for (let r = 0; r < rows; r++){
  for (let c = 0; c < cols; c++){
   if (isNaN(slope[r][c])){ out[r][c] = 0; continue; }
   const sr = slope[r][c] * D2R, ar = aspect[r][c] * D2R;
   const v = Math.cos(zenith) * Math.cos(sr) + Math.sin(zenith) * Math.sin(sr) * Math.cos(azMath - ar);
   out[r][c] = Math.max(0, Math.min(255, Math.round(v * 255)));
  }
 }
 return out;
}
function idwInterpolate(samples, qx, qy, p, k){
 // samples: [{x, y, v}]
 const dists = samples.map(s => ({ ...s, d: Math.hypot(s.x - qx, s.y - qy) }));
 dists.sort((a, b) => a.d - b.d);
 const use = dists.slice(0, k || dists.length);
 let num = 0, den = 0;
 for (const s of use){
  if (s.d < 1e-9) return s.v;
  const w = 1 / Math.pow(s.d, p);
  num += w * s.v;
  den += w;
 }
 return num / den;
}
function dijkstra(n, edges, src){
 const adj = Array.from({length: n}, () => []);
 for (const [u, v, w] of edges){ adj[u].push([v, w]); adj[v].push([u, w]); }
 const dist = new Array(n).fill(Infinity);
 const prev = new Array(n).fill(-1);
 dist[src] = 0;
 const pq = [[0, src]];
 while (pq.length){
  pq.sort((a, b) => a[0] - b[0]);
  const [d, u] = pq.shift();
  if (d > dist[u]) continue;
  for (const [v, w] of adj[u]){
   if (dist[u] + w < dist[v]){
    dist[v] = dist[u] + w;
    prev[v] = u;
    pq.push([dist[v], v]);
   }
  }
 }
 return { dist, prev };
}
function astar(n, edges, src, tgt, heuristic){
 const adj = Array.from({length: n}, () => []);
 for (const [u, v, w] of edges){ adj[u].push([v, w]); adj[v].push([u, w]); }
 const dist = new Array(n).fill(Infinity);
 const prev = new Array(n).fill(-1);
 dist[src] = 0;
 const pq = [[heuristic(src, tgt), 0, src]];
 while (pq.length){
  pq.sort((a, b) => a[0] - b[0]);
  const [f, d, u] = pq.shift();
  if (u === tgt) break;
  if (d > dist[u]) continue;
  for (const [v, w] of adj[u]){
   if (dist[u] + w < dist[v]){
    dist[v] = dist[u] + w;
    prev[v] = u;
    pq.push([dist[v] + heuristic(v, tgt), dist[v], v]);
   }
  }
 }
 return { dist, prev };
}
function pathFrom(prev, src, tgt){
 const path = [];

 path.reverse();
 return path;
}
function catmullRom(P, samples){
 if (P.length < 2) return P.slice();
 const out = [];
 const n = P.length;
 for (let seg = 0; seg < n - 1; seg++){
  const p0 = P[Math.max(0, seg - 1)];
  const p1 = P[seg];
  const p2 = P[seg + 1];
  const p3 = P[Math.min(n - 1, seg + 2)];
  for (let s = 0; s < samples; s++){
   const t = s / samples;
   const t2 = t * t, t3 = t2 * t;
   const x = 0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * t + (2*p0[0] - 5*p1[0] + 4*p2[0] - p3[0]) * t2 + (-p0[0] + 3*p1[0] - 3*p2[0] + p3[0]) * t3);
   const y = 0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t + (2*p0[1] - 5*p1[1] + 4*p2[1] - p3[1]) * t2 + (-p0[1] + 3*p1[1] - 3*p2[1] + p3[1]) * t3);
   out.push([x, y]);
  }
 }
 out.push(P[n - 1]);
 return out;
}
function svgLinePlot(points, opts = {}){
 const W = opts.W || 700, H = opts.H || 280;
 const pad = 30;
 const xs = points.map(p => p[0]), ys = points.map(p => p[1]);
 const xMin = Math.min(...xs), xMax = Math.max(...xs);
 const yMin = Math.min(...ys), yMax = Math.max(...ys);
 const sx = x => pad + (x - xMin) / ((xMax - xMin) || 1) * (W - 2*pad);
 const sy = y => H - pad - (y - yMin) / ((yMax - yMin) || 1) * (H - 2*pad);
 let out = `<line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="var(--line2)"/>`;
 out += `<line x1="${pad}" y1="${pad}" x2="${pad}" y2="${H-pad}" stroke="var(--line2)"/>`;
 if (opts.path){
  let d = '';
  points.forEach((p, i) => { d += (i === 0 ? 'M ' : ' L ') + sx(p[0]).toFixed(1) + ' ' + sy(p[1]).toFixed(1); });
  out += `<path d="${d}" fill="none" stroke="${opts.color || 'var(--accent)'}" stroke-width="2"/>`;
 }
 points.forEach(p => {
  out += `<circle cx="${sx(p[0]).toFixed(1)}" cy="${sy(p[1]).toFixed(1)}" r="${opts.r || 3}" fill="${opts.color || 'var(--accent)'}" opacity="0.85"/>`;
 });
 return `<svg class="plot" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${out}</svg>`;
}
function svgRaster(grid, opts = {}){
 const W = opts.W || 500, H = opts.H || 500;
 const rows = grid.length, cols = grid[0].length;
 const cw = W / cols, ch = H / rows;
 let out = '';
 for (let r = 0; r < rows; r++){
  for (let c = 0; c < cols; c++){
   const v = grid[r][c];
   let color;
   if (opts.colorFn) color = opts.colorFn(v);
   else {
    const t = Math.max(0, Math.min(1, v));
    color = `hsl(${(1-t)*240},70%,${30 + t*50}%)`;
   }
   out += `<rect x="${(c*cw).toFixed(1)}" y="${(r*ch).toFixed(1)}" width="${cw.toFixed(1)}" height="${ch.toFixed(1)}" fill="${color}"/>`;
  }
 }
 return `<svg class="plot" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${out}</svg>`;
}

 "equal-area":{python:`import math\n\ndef lambert_azimuthal_equal_area(lat, lon, lat0, lon0, R=6371008.8):\n    phi = math.radians(lat)\n    phi0 = math.radians(lat0)\n    dl = math.radians(lon - lon0)\n    denom = 1 + math.sin(phi0)*math.sin(phi) + math.cos(phi0)*math.cos(phi)*math.cos(dl)\n    k = math.sqrt(2 / denom)\n    x = R * k * math.cos(phi) * math.sin(dl)\n    y = R * k * (math.cos(phi0)*math.sin(phi) - math.sin(phi0)*math.cos(phi)*math.cos(dl))\n    return x, y\n\nprint(lambert_azimuthal_equal_area(52.52, 13.405, 52.0, 10.0))\n`},
 "quadtree":{python:`from rtree import index\nfrom shapely.geometry import Point, box\n\nidx = index.Index()\nfor i in range(1000):\n    x, y = random.uniform(0, 100), random.uniform(0, 100)\n    idx.insert(i, (x, y, x, y))\n\n# Range query\nbbox = (20, 20, 30, 30)\nresults = list(idx.intersection(bbox))\nprint(len(results), "points in bbox")\n\n# Nearest neighbour\nnearest = list(idx.nearest((25, 25, 25, 25), 1))\nprint("nearest:", nearest)\n`},
 "rtree-kd":{python:`from scipy.spatial import KDTree\nimport numpy as np\n\npoints = np.random.rand(1000, 2) * 100\ntree = KDTree(points)\n\n# Range search\nindices = tree.query_ball_point([50, 50], r=10)\nprint(len(indices), "points within 10")\n\n# k-nearest\ndists, idx = tree.query([50, 50], k=5)\nprint("k-nearest:", idx, dists)\n`},
 "geohash":{python:`import geohash2\n\nh = geohash2.encode(52.52, 13.405, precision=9)\nprint(h)\n\nlat, lon = geohash2.decode(h)\nprint(lat, lon)\n\n# H3\nfrom h3 import h3\nh3_index = h3.geo_to_h3(52.52, 13.405, 9)\nprint(h3_index)\nprint(h3.h3_to_geo(h3_index))\n\n# S2\nfrom s2sphere import LatLng, CellId\nll = LatLng.from_degrees(52.52, 13.405)\ncell = CellId.from_lat_lng(ll).parent(15)\nprint(cell.to_token())\n`},
 "pip":{python:`from shapely.geometry import Point, Polygon\n\npoly = Polygon([(0, 0), (10, 0), (10, 10), (0, 10)])\nprint(poly.contains(Point(5, 5)))   # True\nprint(poly.contains(Point(15, 5)))  # False\n\n# With holes\npoly = Polygon([(0, 0), (10, 0), (10, 10), (0, 10)], holes=[[(2, 2), (4, 2), (4, 4), (2, 4)]])\nprint(poly.contains(Point(3, 3)))   # False (in hole)\n`},
 "range":{python:`from scipy.spatial import KDTree\nimport numpy as np\n\n# 1000 random points in a 100 x 100 box\npoints = np.random.rand(1000, 2) * 100\ntree = KDTree(points)\n\n# Range query: within 5 units of (50, 50)\nidx = tree.query_ball_point([50, 50], 5)\nprint(len(idx))\n\n# k-NN\ndist, idx = tree.query([50, 50], k=3)\nprint(idx, dist)\n`},
 "spatial-join":{python:`import geopandas as gpd\n\n# Load two layers\ncities = gpd.read_file("cities.geojson")\ncounties = gpd.read_file("counties.geojson")\n\n# Spatial join: assign each city to its county\njoined = gpd.sjoin(cities, counties, predicate="within")\nprint(joined.head())\n`},
 "dem":{python:`import numpy as np\nimport rasterio\n\nwith rasterio.open("dem.tif") as src:\n    dem = src.read(1)\n    transform = src.transform\n\n# Slope and aspect with Horn's method\ncell_size = transform.a  # metres per pixel\n\n# dz/dx, dz/dy via 3x3 Sobel-like kernels\ndzdx = np.zeros_like(dem, dtype=float)\ndzdy = np.zeros_like(dem, dtype=float)\ndzdx[1:-1, 1:-1] = ((dem[:-2, 2:] + 2*dem[1:-1, 2:] + dem[2:, 2:]) -\n                     (dem[:-2, :-2] + 2*dem[1:-1, :-2] + dem[2:, :-2])) / (8 * cell_size)\ndzdy[1:-1, 1:-1] = ((dem[2:, :-2] + 2*dem[2:, 1:-1] + dem[2:, 2:]) -\n                     (dem[:-2, :-2] + 2*dem[:-2, 1:-1] + dem[:-2, 2:])) / (8 * cell_size)\n\nslope = np.degrees(np.arctan(np.hypot(dzdx, dzdy)))\naspect = np.degrees(np.arctan2(dzdy, -dzdx)) % 360\nprint("slope range:", slope.min(), slope.max())\n`},

 "idw":{python:`import numpy as np\nfrom scipy.spatial import cKDTree\n\ndef idw(samples, values, query, power=2, k=5):\n    tree = cKDTree(samples)\n    d, idx = tree.query(query, k=k)\n    if d[0] == 0: return values[idx[0]]\n    w = 1 / d**power\n    return np.sum(w * values[idx]) / np.sum(w)\n\nsamples = np.random.rand(50, 2) * 100\nvalues = np.sin(samples[:, 0] / 20) + np.cos(samples[:, 1] / 20)\nprint(idw(samples, values, [50, 50]))\n`},

 "dijkstra":{python:`import heapq\n\ndef dijkstra(n, adj, src, tgt):\n    dist = [float("inf")] * n\n    dist[src] = 0\n    prev = [-1] * n\n    pq = [(0, src)]\n    while pq:\n        d, u = heapq.heappop(pq)\n        if u == tgt: break\n        if d > dist[u]: continue\n        for v, w in adj[u]:\n            if dist[u] + w < dist[v]:\n                dist[v] = dist[u] + w\n                prev[v] = u\n                heapq.heappush(pq, (dist[v], v))\n    return dist[tgt], prev\n`},

 "dp":{python:`def perp_distance(p, a, b):\n    dx, dy = b[0] - a[0], b[1] - a[1]\n    denom = math.hypot(dx, dy)\n    return abs(dy * p[0] - dx * p[1] + b[0] * a[1] - b[1] * a[0]) / denom\n\ndef douglas_peucker(points, tol):\n    if len(points) < 3: return points[:]\n    dmax, index = 0, 0\n    for i in range(1, len(points) - 1):\n        d = perp_distance(points[i], points[0], points[-1])\n        if d > dmax: dmax, index = d, i\n    if dmax > tol:\n        left = douglas_peucker(points[:index+1], tol)\n        right = douglas_peucker(points[index:], tol)\n        return left[:-1] + right\n    return [points[0], points[-1]]\n\nprint(douglas_peucker([(0,0),(1,0.1),(2,-0.1),(3,5),(4,6),(5,7)], 1.0))\n`},

function demoHaversine(text){
 const lines = text.trim().split(/\n/);
 const [la1, lo1] = lines[0].split(/\s+/).map(Number);
 const [la2, lo2] = lines[1].split(/\s+/).map(Number);
 const d = haversine(la1, lo1, la2, lo2);
 const b = initialBearing(la1, lo1, la2, lo2);
 const merc = webMercator(la1, lo1);
 return{
  encoded:`Point A: (${la1}, ${lo1})\nPoint B: (${la2}, ${lo2})\n\nHaversine distance: ${d.toFixed(2)} m = ${(d/1000).toFixed(3)} km\nInitial bearing from A: ${b.toFixed(2)}°\n\nMean Earth radius R = ${R_EARTH} m\nMeters per degree of latitude at A: ${metersPerDegree(la1).lat.toFixed(1)}\nMeters per degree of longitude at A: ${metersPerDegree(la1).lon.toFixed(1)}\n\nWeb Mercator of A: x=${merc.x.toFixed(1)}, y=${merc.y.toFixed(1)}`,
  decoded:`The Haversine formula gives the great-circle distance on a sphere. For the WGS-84 ellipsoid, use Vincenty or Karney.`
 };
}
function demoVincenty(text){

 return{

  decoded:`Vincenty's inverse formula iterates on the auxiliary sphere until the latitude matches. It gives millimetre accuracy on WGS-84 but can fail for nearly antipodal points.`
 };
}
function demoMapUnits(text){

 // nautical miles

 return{

  decoded:`One degree of latitude is nearly constant. One degree of longitude shrinks with cos(latitude). The ellipsoidal formula is more accurate than the spherical approximation.`
 };
}
function demoMercator(text){

  const m = webMercator(la, lo);
  const t = tileFromLatLon(la, lo, 12);
  const inv = inverseWebMercator(m.x, m.y);
  return `  (${la.toFixed(4)}, ${lo.toFixed(4)}) -> Web Mercator (${m.x.toFixed(1)}, ${m.y.toFixed(1)}), tile z=12 (${t.x}, ${t.y}), inverse (${inv.lat.toFixed(4)}, ${inv.lon.toFixed(4)})`;
 });
 return{
  encoded:`Web Mercator projection (EPSG:3857):\n${rows.join('\n')}\n\nNote: y approaches infinity as latitude approaches ±90°.\nWeb Mercator cuts off at ±85.0511°.\nR = 6378137 m (WGS-84 semi-major axis).`,
  decoded:`Web Mercator projects longitude linearly and latitude via a logarithmic formula. Conformal but area-distorted. The XYZ tile scheme is built on this projection.`
 };
}

 };

function demoQuadtreeGrid(text){
 const lines = text.trim().split(/\n/).map(Number);
 const n = lines[0] || 100;
 const gridSize = lines[1] || 10;
 const querySize = lines[2] || 20;
 const seed = lines[3] || 5;
 let s = seed;
 const rnd = () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
 const points = Array.from({length: n}, () => [rnd() * 100, rnd() * 100]);
 // Uniform grid
 const cells = {};
 points.forEach((p, i) => {
  const key = `${Math.floor(p[0]/gridSize)},${Math.floor(p[1]/gridSize)}`;
  (cells[key] = cells[key] || []).push(i);
 });
 // Query box
 const qx = 30, qy = 30;
 const qBox = [qx, qy, qx + querySize, qy + querySize];
 let gridResults = [];
 for (let i = 0; i < Math.ceil(100/gridSize); i++){
  for (let j = 0; j < Math.ceil(100/gridSize); j++){
   const key = `${i},${j}`;
   if (cells[key]){
    for (const pi of cells[key]){
     const p = points[pi];
     if (p[0] >= qBox[0] && p[0] <= qBox[2] && p[1] >= qBox[1] && p[1] <= qBox[3]){
      gridResults.push(p);
     }
    }
   }
  }
 }
 // Linear scan for comparison
 const linearResults = points.filter(p => p[0] >= qBox[0] && p[0] <= qBox[2] && p[1] >= qBox[1] && p[1] <= qBox[3]);
 // Draw
 const W = 500, H = 500;
 let svg = '';
 const cell = W / 100;
 // Grid
 for (let i = 0; i <= 100; i += gridSize){
  svg += `<line x1="${i*cell}" y1="0" x2="${i*cell}" y2="${H}" stroke="var(--line2)" opacity="0.3"/>`;
  svg += `<line x1="0" y1="${i*cell}" x2="${W}" y2="${i*cell}" stroke="var(--line2)" opacity="0.3"/>`;
 }
 // Points
 points.forEach(p => {
  const inside = p[0] >= qBox[0] && p[0] <= qBox[2] && p[1] >= qBox[1] && p[1] <= qBox[3];
  svg += `<circle cx="${p[0]*cell}" cy="${H - p[1]*cell}" r="2" fill="${inside ? 'var(--good)' : 'var(--accent)'}" opacity="0.7"/>`;
 });
 // Query box
 svg += `<rect x="${qBox[0]*cell}" y="${H - qBox[3]*cell}" width="${querySize*cell}" height="${querySize*cell}" fill="none" stroke="var(--warn)" stroke-width="2"/>`;
 return{
  html: `<svg class="plot" viewBox="0 0 ${W} ${H}">${svg}</svg>`,
  encoded:`Points: ${n}\nGrid cell size: ${gridSize}\nQuery box: [${qBox.join(', ')}]\n\nNon-empty grid cells: ${Object.keys(cells).length}\nPoints in query (grid): ${gridResults.length}\nPoints in query (linear scan): ${linearResults.length}\n\nGrid visits only the cells overlapped by the query. Linear scan visits every point.`,
  decoded:`A uniform grid partitions space into equal cells. Range queries visit only the cells overlapped by the bounding box.`
 };
}
function demoRtreeKd(text){
 const lines = text.trim().split(/\n/).map(Number);
 const n = lines[0] || 200;
 const k = lines[1] || 5;
 const dims = Math.min(5, lines[2] || 3);
 const seed = 5;
 let s = seed;
 const rnd = () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
 const points = Array.from({length: n}, () => Array.from({length: dims}, () => rnd() * 100));
 const query = Array.from({length: dims}, () => 50);
 // Simple linear k-NN
 const dists = points.map((p, i) => ({ i, d: Math.sqrt(p.reduce((s, x, j) => s + (x - query[j])**2, 0)) }));
 dists.sort((a, b) => a.d - b.d);
 // Simulate a k-d tree by counting how many points we'd need to examine
 // (in practice the tree prunes)
 const examined = n; // linear scan
 const kdExamined = Math.min(n, Math.ceil(Math.log2(n)) * 3);
 return{
  encoded:`Points: ${n}\nDimensions: ${dims}\nQuery: [${query.map(v => v.toFixed(1)).join(', ')}]\n\nLinear scan distances (top ${k}):\n${dists.slice(0, k).map(d => `  index ${d.i}: ${d.d.toFixed(3)}`).join('\n')}\n\nEstimated work:\n  linear scan: ${examined} distance computations\n  k-d tree:    ~${kdExamined} nodes visited (log-scale)\n\nThe k-d tree prunes subtrees farther than the current best.`,
  decoded:`A k-d tree splits by alternating axes. Range and nearest queries descend only into subtrees that can contain the answer. In high dimensions, pruning becomes ineffective.`
 };
}
function demoGeohash(text){

 const prec = parseInt(lines[2]) || 9;
 const hashes = [];
 for (let p = 1; p <= prec; p++){
  hashes.push(`  precision ${p}: ${geohashEncode(lat, lon, p)}`);
 }

 const cellSizes = [5000, 1250, 156, 39, 4.9, 1.2, 0.15, 0.038, 0.0047];

  encoded:`Point: (${lat}, ${lon})\n\nGeohash at increasing precision:\n${hashes.join('\n')}\n\nCell size (approx) at precision:\n${cellSizes.slice(0, prec).map((s, i) => `  ${i+1}: ${s} km`).join('\n')}\n\nNeighbours of the precision-${prec} hash share a prefix.\nParent cell = first ${Math.max(1, prec - 1)} characters.`,
  decoded:`Geohash interleaves longitude and latitude bits, base-32 encoded. Longer strings are smaller cells. Prefixes identify parent cells.`
 };
}
function demoPointInPolygon(text){
 const lines = text.trim().split(/\n/);
 const polyLine = lines[1] || '0 0 10 0 10 10 0 10';
 const polyNums = polyLine.split(/\s+/).map(Number);
 const poly = [];
 for (let i = 0; i < polyNums.length; i += 2) poly.push([polyNums[i], polyNums[i+1]]);
 const queryLine = lines[2] || '5 5';
 const [qx, qy] = queryLine.split(/\s+/).map(Number);

 // Draw

 const yMin = Math.min(...ys, qy) - 1, yMax = Math.max(...ys, qy) + 1;
 const sx = x => pad + (x - xMin) / (xMax - xMin) * (W - 2*pad);

 let pathD = '';
 poly.forEach((p, i) => { pathD += (i === 0 ? 'M ' : ' L ') + sx(p[0]).toFixed(1) + ' ' + sy(p[1]).toFixed(1); });
 pathD += ' Z';
 let svg = `<path d="${pathD}" fill="${inside ? 'rgba(158,215,189,0.3)' : 'rgba(255,146,158,0.2)'}" stroke="var(--accent)" stroke-width="2"/>`;
 svg += `<circle cx="${sx(qx).toFixed(1)}" cy="${sy(qy).toFixed(1)}" r="6" fill="${inside ? 'var(--good)' : 'var(--bad)'}"/>`;
 svg += `<line x1="${sx(qx).toFixed(1)}" y1="${sy(qy).toFixed(1)}" x2="${W-pad}" y2="${sy(qy).toFixed(1)}" stroke="var(--warn)" stroke-dasharray="4 4"/>`;

function demoViewshed(text){

 let s = 5;
 const rnd = () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
 const dem = Array.from({length: rows}, (_, r) =>
  Array.from({length: cols}, (_, c) => {

   return 100 + 40 * Math.sin(x * Math.PI) * Math.sin(y * Math.PI) + 5 * rnd();
  })
 );
 // Simple viewshed: for each cell, check line to observer

  for (let c = 0; c < cols; c++){
   if (r === obsY && c === obsX){ visible[r][c] = 1; continue; }

   const steps = Math.max(Math.abs(dx), Math.abs(dy));
   let maxAngle = -Infinity;
   let blocked = false;
   const obsZ = dem[obsY][obsX] + obsH;
   for (let k = 1; k < steps; k++){

    const y = Math.round(obsY + dy * k / steps);

function runLab(l, initial){

  if (!initial){ $('#labEncoded').textContent = 'Running…'; $('#labDecoded').textContent = ''; }
  switch (l.demo){
   case 'haversine': res = demoHaversine(input); break;
   case 'vincenty': res = demoVincenty(input); break;
   case 'map-units': res = demoMapUnits(input); break;
   case 'mercator': res = demoMercator(input); break;
   case 'utm': res = demoUtm(input); break;
   case 'equal-area': res = demoEqualArea(input); break;
   case 'quadtree': res = demoQuadtreeGrid(input); break;
   case 'rtree-kd': res = demoRtreeKd(input); break;
   case 'geohash': res = demoGeohash(input); break;
   case 'pip': res = demoPointInPolygon(input); break;
   case 'range': res = demoRangeNearest(input); break;
   case 'spatial-join': res = demoSpatialJoins(input); break;
   case 'dem': res = demoDem(input); break;
   case 'hillshade': res = demoHillshade(input); break;
   case 'viewshed': res = demoViewshed(input); break;
   case 'idw': res = demoIdw(input); break;
   case 'spline': res = demoSpline(input); break;
